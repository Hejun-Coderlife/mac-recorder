<!doctype html>
<!-- 录屏宣传片（第三版，参考 videoplayback.mp4 的风格）：淡色纯底 + 真实界面大圆角卡片 + 极少的宋体短句。
     画面按时间 t 完全确定：window.PROMO.frame(t) 摆好这一帧（record.mjs 逐帧截图）。浏览器直接打开 = 实时预览 -->
<html lang="zh"><head><meta charset="utf-8"><title>录屏</title>
<style>
  :root { --bg: #ECEDF1; --ink: #23252B; --soft: #A3A6AF; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  * { box-sizing: border-box; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }
  .card { border-radius: 26px; overflow: hidden; background: #fff;
          box-shadow: 0 40px 90px rgba(35, 40, 70, .16), 0 6px 18px rgba(35, 40, 70, .08); }
  .card img.fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .words { font-family: "Songti SC", "STSong", serif; font-weight: 300; color: var(--ink); font-size: 76px; line-height: 1.22;
           letter-spacing: 2px; white-space: nowrap; }
  .words span { display: inline-block; }
  .words .l2 { display: block; }
  #cursor { width: 30px; height: 46px; z-index: 50; }
</style></head>
<body>
<!-- 开头：图标 -->
<img id="icon" class="abs" src="icon.png" style="width:220px;height:220px;filter:drop-shadow(0 30px 50px rgba(35,40,70,.18))">

<!-- 镜头 2：原始录屏 → Studio 成片 -->
<div id="c2" class="abs card"><img id="c2a" class="fill"><img id="c2b" class="fill"></div>

<!-- 镜头 3：剪辑窗口（按截图原尺寸 2880×1640 摆，整体缩放） -->
<div id="ed" class="abs card" style="width:2880px;height:1640px;border-radius:44px">
  <img src="editor.png" style="position:absolute;left:0;top:0;width:2880px;height:1640px">
  <div style="position:absolute;left:237px;top:118px;width:1804px;height:1014px;overflow:hidden">
    <img id="edA" style="position:absolute;inset:0;width:100%;height:100%"><img id="edB" style="position:absolute;inset:0;width:100%;height:100%">
  </div>
  <!-- 放大滑块和「2.0×」重画（盖住截图上的） -->
  <div style="position:absolute;left:400px;top:1296px;width:430px;height:54px;background:#fff"></div>
  <div style="position:absolute;left:415px;top:1319px;width:320px;height:6px;border-radius:3px;background:#DDDDDD"></div>
  <div id="sfill" style="position:absolute;left:415px;top:1319px;height:6px;border-radius:3px;background:#C9C9C9"></div>
  <div id="sknob" style="position:absolute;top:1302px;width:40px;height:40px;border-radius:50%;background:#FAFAFA;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.12)"></div>
  <div id="slabel" style="position:absolute;left:768px;top:1304px;font:600 32px -apple-system,'PingFang SC';color:#272727">2.0×</div>
  <div style="position:absolute;left:744px;top:1474px;width:110px;height:48px;background:#7065EB"></div>
  <div id="blabel" style="position:absolute;left:740px;top:1475px;width:120px;text-align:center;font:600 30px -apple-system,'PingFang SC';color:#fff">2.0×</div>
</div>

<!-- 镜头 4：比例 / 背景连续变化 -->
<div id="c4" class="abs card"><img id="c4a" class="fill"><img id="c4b" class="fill"></div>

<!-- 镜头 5：顺滑（运动模糊，慢放） -->
<div id="c5" class="abs card"><img id="c5a" class="fill"></div>

<!-- 镜头 6：Windows 截图 -->
<div id="win" class="abs card" style="width:1440px;height:810px;background:linear-gradient(140deg,#E4ECF7,#CCD9EE 55%,#D9D3EC)">
  <div style="position:absolute;left:60px;top:58px;width:820px;height:513px;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(30,40,70,.18)">
    <img src="todo.jpg" style="width:820px;height:513px;display:block">
    <div style="position:absolute;left:0;top:0;right:0;height:30px;background:#FAFAFA;border-bottom:1px solid #EEE;font:500 15px 'PingFang SC';color:#333;display:flex;align-items:center;padding-left:16px">
      待办<span style="margin-left:auto;display:flex;gap:26px;padding-right:18px;color:#555;font-size:14px">— &nbsp;□ &nbsp;✕</span></div>
  </div>
  <div id="chat" style="position:absolute;left:930px;top:100px;width:450px;height:560px;border-radius:12px;background:#fff;box-shadow:0 18px 40px rgba(30,40,70,.18);overflow:hidden">
    <div style="height:52px;border-bottom:1px solid #EEE;display:flex;align-items:center;gap:12px;padding:0 18px;font:600 17px 'PingFang SC';color:#222">
      <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#9FC2F2,#6E8FE6)"></div>小王</div>
    <div style="padding:18px">
      <div style="width:200px;height:38px;border-radius:10px;background:#F1F2F5;margin-bottom:14px"></div>
      <div style="width:150px;height:38px;border-radius:10px;background:#F1F2F5;margin-bottom:14px"></div>
      <div style="width:170px;height:38px;border-radius:10px;background:#D7E6FF;margin-left:auto"></div>
    </div>
    <div id="sent" style="position:absolute;right:18px;top:250px;width:240px;height:150px;border-radius:10px;overflow:hidden;background:url(todo.jpg);box-shadow:0 2px 8px rgba(0,0,0,.12)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:96px;border-top:1px solid #EEE"></div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(255,255,255,.72);display:flex;justify-content:center;gap:14px;align-items:center">
    <div style="width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#3C8CE7,#2A63D4)"></div>
    <div style="width:26px;height:26px;border-radius:6px;background:#E8B44C"></div>
    <div style="width:26px;height:26px;border-radius:6px;background:#5FBF72"></div>
    <img src="icon.png" style="width:28px;height:28px">
  </div>
  <div id="dim" style="position:absolute;box-shadow:0 0 0 3000px rgba(20,25,40,.32);border:2px solid #fff;border-radius:2px"></div>
  <div id="flash" style="position:absolute;inset:0;background:#fff"></div>
  <div id="thumb" style="position:absolute;width:240px;height:150px;border-radius:10px;overflow:hidden;background:url(todo.jpg);border:3px solid #fff;box-shadow:0 14px 34px rgba(20,30,60,.28)"></div>
</div>
<div id="keys" class="abs" style="display:flex;gap:12px;font:500 26px -apple-system,'PingFang SC';color:#3A3D45">
  <span style="padding:10px 18px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #D6D8DE,0 8px 20px rgba(30,35,60,.08)">Ctrl</span>
  <span style="padding:10px 18px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #D6D8DE,0 8px 20px rgba(30,35,60,.08)">Alt</span>
  <span style="padding:10px 18px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #D6D8DE,0 8px 20px rgba(30,35,60,.08)">X</span>
</div>

<!-- 结尾 -->
<img id="icon2" class="abs" src="icon.png" style="width:170px;height:170px;filter:drop-shadow(0 26px 44px rgba(35,40,70,.16))">

<!-- 文字：每块逐字出现，第一行灰 → 第二行深 -->
<div id="w2" class="abs words"></div>
<div id="w3" class="abs words"></div>
<div id="w4" class="abs words"></div>
<div id="w5" class="abs words"></div>
<div id="w6" class="abs words"></div>
<div id="w7" class="abs words" style="font-size:96px;letter-spacing:10px"></div>
<div id="w7b" class="abs words" style="font-size:34px;letter-spacing:6px;color:#8C8F99"></div>

<svg id="cursor" class="abs" viewBox="0 0 20 30"><path d="M1.5 1.5 L1.5 22.5 L6.6 17.6 L10.2 26.4 L14 24.8 L10.4 16.2 L17.4 16.2 Z" fill="#111" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>

<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => cl((t - a) / (b - a));                 // 0→1 线性
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;   // 缓入缓出
const out = x => 1 - Math.pow(1 - x, 3);
const E = (t, a, b) => io(P(t, a, b));
const L = (a, b, k) => a + (b - a) * k;
const FPS = 30;
const pad = n => String(n).padStart(5, '0');
const frameSrc = (clip, footStart, foot, fps = 30) => `frames/${clip}/${pad(Math.max(0, Math.round((foot - footStart) * fps)))}.jpg`;
function setImg(el, src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); }
function place(el, x, y, w, h, o = 1, extra = '') {
  el.style.transform = `translate(${x}px,${y}px)${extra}`; el.style.opacity = o;
  if (w != null) el.style.width = w + 'px'; if (h != null) el.style.height = h + 'px';
  el.style.visibility = o > 0.001 ? 'visible' : 'hidden';
}
const hide = el => { el.style.visibility = 'hidden'; el.style.opacity = 0; };

// 文字：lines = ['点到哪','看到哪']，t0 开始逐字出，t1 开始淡出
function words(el, lines, t, t0, t1, x, y, align = 'left') {
  if (el.dataset.k !== lines.join('|')) {
    el.innerHTML = lines.map((s, i) => `<span class="l2" style="text-align:${align}">${[...s].map(ch => `<span>${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')}</span>`).join('');
    el.dataset.k = lines.join('|');
  }
  if (t < t0 - .01 || t > t1 + .6) { hide(el); return; }
  const fade = 1 - E(t, t1, t1 + .5);
  let k = 0;
  el.querySelectorAll('.l2').forEach((ln, li) => {
    ln.querySelectorAll('span').forEach(s => {
      const a = out(P(t, t0 + k * .07 + li * .25, t0 + k * .07 + li * .25 + .55)); k++;
      s.style.opacity = a; s.style.transform = `translateY(${(1 - a) * 18}px)`; s.style.filter = `blur(${(1 - a) * 6}px)`;
      s.style.color = li === 0 && lines.length > 1 ? `rgb(${L(163, 35, E(t, t0 + 1.4, t0 + 2.2))},${L(166, 37, E(t, t0 + 1.4, t0 + 2.2))},${L(175, 43, E(t, t0 + 1.4, t0 + 2.2))})` : '';
    });
  });
  const w = el.offsetWidth;
  place(el, align === 'center' ? x - w / 2 : align === 'right' ? x - w : x, y, null, null, fade);
}

// 鼠标
function cursor(x, y, o, press = 0) { place($('cursor'), x, y, null, null, o, ` scale(${1 - press * .12})`); }

const END = 47.0;
const clicks = [];   // 轻音效时刻
async function frame(t) {
  // ---------- 1. 开头：图标 ----------
  {
    const a = out(P(t, .15, 1.1)), b = E(t, 3.2, 4.2);
    const s = L(.86, 1, a) * L(1, .7, b);
    const w = 220 * s;
    if (t < 4.3) place($('icon'), 960 - w / 2, 540 - w / 2 - b * 60, null, null, a * (1 - b), ` scale(${s})`); else hide($('icon'));
    $('icon').style.transformOrigin = '0 0';
    if (t < 4.3) $('icon').style.transform = `translate(${960 - w / 2}px,${540 - w / 2 - b * 60}px) scale(${s})`;
  }

  // ---------- 2. 原始录屏 → 自动凑近（4.0–11.6） ----------
  {
    const c = $('c2');
    if (t > 3.8 && t < 11.8) {
      const enter = out(P(t, 3.9, 5.0)), leave = E(t, 10.9, 11.7);
      const ar = L(1.6, 3636 / 2044, E(t, 5.6, 6.3));      // 原始 16:10 → 成片 16:9
      const w = L(1120, 1160, E(t, 5.6, 6.3)), h = w / ar;
      const x = L(170, -900, leave), y = 540 - h / 2 + (1 - enter) * 90;
      place(c, x, y, w, h, enter);
      const foot = 4.5 + (t - 4.0);
      setImg($('c2a'), frameSrc('raw', 4.5, Math.min(foot, 12.2)));
      setImg($('c2b'), frameSrc('tut', 6.0, cl(foot, 6.0, 17.2)));
      $('c2b').style.opacity = E(t, 5.6, 6.3);
    } else hide(c);
    words($('w2'), ['点到哪', '看到哪'], t, 6.6, 10.6, 1420, 400);
  }

  // ---------- 3. 剪辑窗口：拖一下滑块，画面跟着凑得更近（11.3–20.2） ----------
  {
    const ed = $('ed');
    if (t > 11.2 && t < 20.4) {
      const enter = out(P(t, 11.3, 12.4)), leave = E(t, 19.4, 20.2);
      const s0 = 1480 / 2880;                                  // 整张显示宽 1640
      const z = L(1, 1.85, E(t, 13.6, 15.2)) * L(1, .62, leave);
      const fx = L(1440, 640, E(t, 13.6, 15.2)), fy = L(820, 1290, E(t, 13.6, 15.2));   // 镜头对准的点（截图坐标）
      const S = s0 * z * L(.94, 1, enter);
      const cx = 960, cy = L(628, 540, E(t, 13.6, 15.2)) + (1 - enter) * 120;
      const x = cx - fx * S, y = cy - fy * S;
      ed.style.transform = `translate(${x}px,${y}px) scale(${S})`; ed.style.opacity = enter * (1 - leave); ed.style.visibility = 'visible';
      // 滑块：2.0 → 3.0
      const k = E(t, 15.9, 16.9), zoom = L(2.0, 3.0, k);
      const kx = L(515, 622, k);
      $('sknob').style.left = (kx - 20) + 'px'; $('sfill').style.width = (kx - 415) + 'px';
      $('slabel').textContent = zoom.toFixed(1) + '×'; $('blabel').textContent = zoom.toFixed(1) + '×';
      const foot = 8.0 + (t - 11.3);
      setImg($('edA'), frameSrc('tut', 6.0, cl(foot, 6, 17.2)));
      setImg($('edB'), frameSrc('z3', 10.0, cl(foot, 10, 17.2)));
      $('edB').style.opacity = k;
      // 鼠标：飞到滑块、按住拖、松开
      const tgt = p => [x + p[0] * S, y + p[1] * S];
      const from = tgt([1500, 900]), at = tgt([515, 1322]), to = tgt([622, 1322]);
      const m = E(t, 14.8, 15.7);
      let px = L(from[0], at[0], m), py = L(from[1], at[1], m);
      if (t > 15.9) { px = L(at[0], to[0], k); py = at[1]; }
      const press = t > 15.75 && t < 17.0 ? 1 : 0;
      const co = P(t, 14.6, 14.9) * (1 - P(t, 18.2, 18.6));
      if (co > 0) cursor(px - 4, py - 4, co, press); else hide($('cursor'));
    } else { hide(ed); }
    words($('w3'), ['拖一拖'], t, 12.2, 13.4, 960, 44, 'center');
  }

  // ---------- 4. 横屏 → 竖屏 → 方形 → 壁纸（20.0–29.4） ----------
  {
    const c = $('c4');
    const seq = [   // [开始, 剪辑名, 宽, 高]
      [20.0, 'tut', 1240, 1240 * 2044 / 3636],
      [22.6, 'dy', 520, 520 * 3954 / 2224],
      [25.0, 'sq', 820, 820],
      [27.2, 'wall', 1240, 1240 * 2044 / 3636],
    ];
    if (t > 19.6 && t < 29.6) {
      let i = seq.length - 1; while (i > 0 && t < seq[i][0]) i--;
      const cur = seq[i], prev = seq[Math.max(0, i - 1)];
      const m = i > 0 ? E(t, cur[0], cur[0] + .7) : 1;
      const w = L(prev[2], cur[2], m), h = L(prev[3], cur[3], m);
      const enter = out(P(t, 19.7, 20.6)), leave = E(t, 28.9, 29.6);
      const s = L(.9, 1, enter) * L(1, .92, leave);
      const cx = L(1060, 960, E(t, 22.4, 23.0)) , cy = 540;
      place(c, cx - w * s / 2, cy - h * s / 2, w * s, h * s, enter * (1 - leave));
      const foot = 17.5 + (t - 20.0) * 0.32;                // 两段推近之间的全景（慢放），看得到整个画面和背景
      setImg($('c4a'), frameSrc(prev[1] + 'B', 17.4, cl(foot, 17.4, 20.5)));
      setImg($('c4b'), frameSrc(cur[1] + 'B', 17.4, cl(foot, 17.4, 20.5)));
      $('c4b').style.opacity = m;
    } else hide(c);
    words($('w4'), ['横屏 竖屏', '随你'], t, 23.1, 26.6, 200, 410);
  }

  // ---------- 5. 顺滑：慢放运动模糊（29.4–34.8） ----------
  {
    const c = $('c5');
    if (t > 29.2 && t < 35.0) {
      const enter = out(P(t, 29.3, 30.3)), leave = E(t, 34.2, 34.9);
      const w = 1180, h = w * 2044 / 3636;
      place(c, 140 + (1 - enter) * 60, 540 - h / 2, w, h, enter * (1 - leave));
      const foot = 20.3 + (t - 29.4) * 0.45;                  // 0.45 倍慢放
      setImg($('c5a'), frameSrc('blur', 19.8, cl(foot, 19.8, 22.9), 60));
    } else hide(c);
    words($('w5'), ['每一帧', '都顺滑'], t, 30.4, 33.9, 1450, 400);
  }

  // ---------- 6. Windows：框一块，小图拖进聊天（34.8–41.8） ----------
  {
    const wv = $('win');
    if (t > 34.6 && t < 42.0) {
      const enter = out(P(t, 34.7, 35.7)), leave = E(t, 41.1, 41.8);
      const s = L(.94, 1, enter), W0 = 1440 * s, H0 = 810 * s;
      const X = 960 - W0 / 2, Y = 590 - H0 / 2 + (1 - enter) * 80;
      wv.style.transformOrigin = '0 0';
      wv.style.transform = `translate(${X}px,${Y}px) scale(${s})`; wv.style.opacity = enter * (1 - leave); wv.style.visibility = 'visible';
      // 快捷键
      const ka = out(P(t, 36.15, 36.45)) * (1 - E(t, 37.1, 37.5));
      const kk = $('keys'); place(kk, 960 - kk.offsetWidth / 2, Y - 92 + (1 - ka) * 10, null, null, ka * (1 - leave));
      // 框选：从 (320,120) 拖到 (720,380)（桌面坐标）
      const sel = E(t, 36.3, 37.0), dimOn = P(t, 36.0, 36.2) * (1 - P(t, 37.15, 37.3));
      const x0 = 250, y0 = 125, x1 = L(x0, 700, sel), y1 = L(y0, 385, sel);
      const d = $('dim'); d.style.left = x0 + 'px'; d.style.top = y0 + 'px'; d.style.width = (x1 - x0) + 'px'; d.style.height = (y1 - y0) + 'px'; d.style.opacity = dimOn;
      $('flash').style.opacity = .7 * (1 - P(t, 37.15, 37.5)) * (t > 37.15 ? 1 : 0);
      // 截到的图（todo.jpg 里对应的一块）：右下角滑进来 → 被拖进聊天
      const crop = el => { const k = 240 / (700 - 250); el.style.backgroundSize = `${820 * k}px ${513 * k}px`;   // 框选那块（桌面坐标）在待办窗口里的位置
        el.style.backgroundPosition = `${-(250 - 60) * k}px ${-(125 - 58) * k}px`; el.style.height = (260 * k) + 'px'; };
      const th = $('thumb'), se = $('sent'); crop(th); crop(se);
      const tin = out(P(t, 37.3, 37.9)), drag = E(t, 38.6, 39.6), drop = P(t, 39.6, 39.75);
      const tx = L(L(1440 + 20, 1160, tin), 1170 + 0, drag), ty = L(610, 400, drag);
      const ts = L(1, .9, drag);
      th.style.left = tx + 'px'; th.style.top = ty + 'px'; th.style.transform = `scale(${ts})`;
      th.style.opacity = t < 37.3 ? 0 : (1 - drop);
      const sa = out(P(t, 39.6, 40.1));
      se.style.opacity = sa; se.style.transform = `scale(${L(.85, 1, sa)})`; se.style.transformOrigin = '100% 100%';
      // 鼠标：框选 → 去抓小图 → 拖进聊天
      const toScr = (px, py) => [X + px * s, Y + py * s];
      let p;
      if (t < 37.0) p = toScr(L(x0, x1, 1), L(y0, y1, 1));
      else if (t < 38.6) { const m = E(t, 37.7, 38.5); p = toScr(L(700, tx + 120, m), L(385, ty + 70, m)); }
      else p = toScr(tx + 120 * ts, ty + 70 * ts);
      if (t < 36.3) p = toScr(L(600, x0, E(t, 35.6, 36.2)), L(560, y0, E(t, 35.6, 36.2)));
      const press = (t > 36.3 && t < 37.0) || (t > 38.55 && t < 39.6) ? 1 : 0;
      const co = P(t, 35.5, 35.8) * (1 - P(t, 40.3, 40.7));
      cursor(p[0] - 3, p[1] - 3, co * (1 - leave), press);
    } else { hide(wv); hide($('keys')); }
    words($('w6'), ['Mac 和 Windows'], t, 34.2, 35.75, 960, 60, 'center');
    if (t > 42.2 && t < 47) {} // 占位
  }

  // ---------- 7. 结尾 ----------
  {
    const a = out(P(t, 41.9, 42.9)), z = END;
    const w = 170;
    if (t > 41.8) place($('icon2'), 960 - w / 2, 330 + (1 - a) * 30, null, null, a); else hide($('icon2'));
    words($('w7'), ['录屏'], t, 42.5, 99, 960, 540, 'center');
    words($('w7b'), ['录完，就是成片'], t, 43.4, 99, 960, 680, 'center');
  }
  if (!(t > 11.2 && t < 20.4) && !(t > 34.6 && t < 42.0)) hide($('cursor'));
