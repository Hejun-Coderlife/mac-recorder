# Windows 版：编译 → 打包 zip（exe + 录制引擎 + 同目录 VC++ 运行库 + Studio 用的 ffmpeg.exe）→ 在 runner 上真录几秒自测（含 Studio 效果）
name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build windows/ScreenRecorder.csproj -c Release -p:Platform=x64

      - name: Package
        run: |
          $out = "windows/bin/x64/Release/net48"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item "$out/ScreenRecorder.exe" "pkg/录屏.exe"
          Copy-Item "$out/ScreenRecorder.exe.config" "pkg/录屏.exe.config"
          Copy-Item "$out/ScreenRecorderLib.dll" pkg/
          # ScreenRecorderLib 是 C++/CLI，要 VC++ 2015-2022 运行库；放在 exe 同目录（app-local），用户不用另装 vc_redist
          foreach ($d in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "concrt140.dll") {
            Copy-Item "C:\Windows\System32\$d" pkg/
          }
          # Studio 效果读写视频用的 ffmpeg（BtbN 的 Windows 64 位 GPL 版，带 libx264）
          # 取最新的正式分支版（文件名形如 ffmpeg-n8.1-latest-win64-gpl-8.1.zip，版本号会变，所以按规则挑）
          $rel = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $asset = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n[\d.]+-latest-win64-gpl-[\d.]+\.zip$' } | Sort-Object { [version]($_.name -replace '^ffmpeg-n([\d.]+)-.*$', '$1') } | Select-Object -Last 1
          Write-Host "ffmpeg: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $ffdir = Get-ChildItem ff -Directory | Select-Object -First 1
          Copy-Item "$($ffdir.FullName)/bin/ffmpeg.exe" pkg/
          Copy-Item "$($ffdir.FullName)/LICENSE.txt" "pkg/ffmpeg-LICENSE.txt"
          & pkg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          Copy-Item windows/README.txt pkg/
          Compress-Archive -Path pkg/* -DestinationPath ScreenRecorder-Windows-x64.zip
          Get-ChildItem pkg, ScreenRecorder-Windows-x64.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-Windows-x64
          path: ScreenRecorder-Windows-x64.zip

      - name: Self-test (auto update: pretend to be v1.0, update to the latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "upd"
          Copy-Item pkg $dir -Recurse
          $before = (Get-FileHash "$dir\录屏.exe").Hash
          # 期望装上的：最新 Release 里的 录屏.exe
          gh release download --repo "${{ github.repository }}" --pattern ScreenRecorder-Windows-x64.zip --dir latest
          Expand-Archive latest\ScreenRecorder-Windows-x64.zip latest\x
          $expected = (Get-FileHash "latest\x\录屏.exe").Hash
          $env:UPDATE_TEST = "1"; $env:UPDATE_FAKE_VERSION = "1.0"; $env:UPDATE_NORELAUNCH = "1"; $env:UPDATE_TOKEN = "${{ github.token }}"
          $p = Start-Process -FilePath "$dir\录屏.exe" -Wait -PassThru
          $res = "$env:TEMP\update_test.txt"
          for ($i = 0; $i -lt 90 -and -not ((Test-Path $res) -and (Get-Content $res -Raw) -match "COPIED|COPY FAIL|FAIL|UPTODATE")); $i++) { Start-Sleep 1 }
          for ($i = 0; $i -lt 60 -and (Get-Content $res -Raw) -match "^STAGED" -and (Get-Content $res -Raw) -notmatch "COPIED|COPY FAIL"; $i++) { Start-Sleep 1 }
          $txt = Get-Content $res -Raw
          Write-Host "exit=$($p.ExitCode)`n$txt"
          if ($p.ExitCode -ne 0 -or $txt -notmatch "STAGED" -or $txt -notmatch "COPIED OK") { throw "update self-test failed" }
          $after = (Get-FileHash "$dir\录屏.exe").Hash
          Write-Host "before=$before after=$after expected=$expected"
          if ($after -ne $expected -or $after -eq $before) { throw "录屏.exe was not replaced by the release build" }
          foreach ($f in "ScreenRecorderLib.dll", "ffmpeg.exe", "录屏.exe.config") { if (!(Test-Path "$dir\$f")) { throw "missing $f after update" } }

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress | Out-Null

      - name: Self-test (screen / region / window, no audio)
        run: |
          function Rec($name, $vars) {
            $out = Join-Path $env:RUNNER_TEMP "$name.mp4"
            Remove-Item "$env:TEMP\recorder_test.txt" -ErrorAction SilentlyContinue
            $env:AUTOTEST = "3"; $env:AUTOOUT = $out
            foreach ($k in "AUTOREGION", "AUTOWINDOW", "AUTOAUDIO") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
            foreach ($k in $vars.Keys) { Set-Item "env:$k" $vars[$k] }
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
            Write-Host "[$name] exit=$($p.ExitCode) $res"
            if ($p.ExitCode -ne 0 -or -not $res.StartsWith("OK")) { throw "$name failed" }
            $info = ffprobe -v error -show_entries "stream=codec_type,codec_name,width,height:format=duration" -of json $out | ConvertFrom-Json
            $v = $info.streams | Where-Object codec_type -eq video
            $dur = [double]$info.format.duration
            Write-Host "[$name] $($v.codec_name) $($v.width)x$($v.height) duration=$dur audio=$(@($info.streams | Where-Object codec_type -eq audio).Count)"
            if ($v.codec_name -ne "h264") { throw "${name}: no h264 video" }
            if ($dur -lt 2 -or $dur -gt 5) { throw "${name}: duration $dur not ~3s" }
            # 画面确实在动：抽两帧比较
            ffmpeg -v error -y -ss 0.5 -i $out -frames:v 1 "$env:RUNNER_TEMP\$name-a.png"
            ffmpeg -v error -y -ss 2.5 -i $out -frames:v 1 "$env:RUNNER_TEMP\$name-b.png"
            $ha = (Get-FileHash "$env:RUNNER_TEMP\$name-a.png").Hash; $hb = (Get-FileHash "$env:RUNNER_TEMP\$name-b.png").Hash
            if ($ha -eq $hb) { throw "${name}: frames identical, picture not moving" }
            return $v
          }
          Rec "screen" @{} | Out-Null
          $v = Rec "region" @{ AUTOREGION = "20,20,640,360" }
          if ($v.width -ne 640 -or $v.height -ne 360) { throw "region size $($v.width)x$($v.height), expected 640x360" }
          Rec "window" @{ AUTOWINDOW = "autotest" } | Out-Null

      - name: Self-test (system audio)
        continue-on-error: true
        run: |
          $out = Join-Path $env:RUNNER_TEMP "audio.mp4"
          $env:AUTOTEST = "3"; $env:AUTOOUT = $out; $env:AUTOAUDIO = "1"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          Write-Host (Get-Content "$env:TEMP\recorder_test.txt" -Raw)
          if ($p.ExitCode -ne 0) { throw "audio recording failed (runner may have no audio device)" }
          ffprobe -v error -show_entries "stream=codec_type,codec_name,channels,sample_rate:format=duration" -of compact $out
          if (-not (ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 $out)) { throw "no audio track" }

      - name: Self-test (Studio effects, simulated mouse / clicks / typing)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "studio"; New-Item -ItemType Directory -Force $dir | Out-Null
          $out = Join-Path $dir "studio.mp4"
          foreach ($k in "AUTOREGION", "AUTOWINDOW") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $env:AUTOTEST = "6"; $env:AUTOOUT = $out; $env:AUTOSTUDIO = "1"; $env:AUTOINPUT = "1"; $env:AUTOAUDIO = "1"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
          Write-Host "exit=$($p.ExitCode)`n$res"
          if ($p.ExitCode -ne 0 -or -not $res.StartsWith("OK")) { throw "studio recording failed" }
          # 素材也留一份看
          $raw = ($res -split "`n" | Where-Object { $_ -match "^studio raw=(.+?) first" } | ForEach-Object { $Matches[1] })
          Copy-Item (Split-Path $raw) (Join-Path $dir "project") -Recurse
          Get-Content (Join-Path $dir "project/track.json") -Raw | Write-Host
          $info = ffprobe -v error -show_entries "stream=codec_type,codec_name,width,height,r_frame_rate:format=duration" -of json $out | ConvertFrom-Json
          $v = $info.streams | Where-Object codec_type -eq video; $a = @($info.streams | Where-Object codec_type -eq audio)
          $dur = [double]$info.format.duration
          Write-Host "studio: $($v.codec_name) $($v.width)x$($v.height) $($v.r_frame_rate) duration=$dur audio=$($a.Count)"
          if ($v.codec_name -ne "h264" -or $v.r_frame_rate -ne "60/1") { throw "not h264 60fps" }
          if ($dur -lt 5 -or $dur -gt 7.5) { throw "duration $dur not ~6s" }
          if ($a.Count -ne 1) { throw "expected one audio track" }
          foreach ($t in "0.3", "1.6", "2.6", "4.4", "5.5") { ffmpeg -v error -y -ss $t -i $out -frames:v 1 (Join-Path $dir "frame-$t.png") }
          Add-Type -AssemblyName System.Drawing
          # 画面四周一圈（外沿 2%）有多少接近白色：没放大时应该几乎全白（白色背景），放大后背景出画、应该很少
          function WhiteBorder($file) {
            $b = [System.Drawing.Bitmap]::new($file); $w = $b.Width; $h = $b.Height; $m = [int]([Math]::Min($w, $h) * 0.02); $n = 0; $white = 0
            for ($x = 0; $x -lt $w; $x += 7) { foreach ($y in 1, ($h - 2)) { $c = $b.GetPixel($x, $y); $n++; if ($c.R -gt 240 -and $c.G -gt 240 -and $c.B -gt 240) { $white++ } } }
            for ($y = 0; $y -lt $h; $y += 7) { foreach ($x in 1, ($w - 2)) { $c = $b.GetPixel($x, $y); $n++; if ($c.R -gt 240 -and $c.G -gt 240 -and $c.B -gt 240) { $white++ } } }
            $center = $b.GetPixel([int]($w / 2), [int]($h / 2)); $b.Dispose()
            return @{ white = $white / $n; center = $center }
          }
          $f0 = WhiteBorder (Join-Path $dir "frame-0.3.png"); $f1 = WhiteBorder (Join-Path $dir "frame-2.6.png")
          Write-Host "border white: 0.3s=$($f0.white)  2.6s=$($f1.white)"
          if ($f0.white -lt 0.95) { throw "white background missing at 0.3s ($($f0.white))" }
          if ($f1.white -gt 0.5) { throw "not zoomed in at 2.6s ($($f1.white))" }

      - name: Studio render speed (synthetic 1920x1080, 20 s)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "speed"; New-Item -ItemType Directory -Force $dir | Out-Null
          ffmpeg -v error -y -f lavfi -i "testsrc2=s=1920x1080:r=30:d=20" -f lavfi -i "sine=f=440:d=20" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac (Join-Path $dir "raw.mp4")
          foreach ($k in "AUTOTEST", "AUTOSTUDIO") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $env:STUDIO = $dir; $env:STUDIO_OUT = (Join-Path $dir "studio.mp4"); $env:STUDIO_FAKETRACK = "1"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
          Write-Host "exit=$($p.ExitCode)`n$res"
          Write-Host "cpu: $((Get-CimInstance Win32_Processor).Name) x $([Environment]::ProcessorCount)"
          if ($p.ExitCode -ne 0) { throw "render failed" }
          ffmpeg -v error -y -ss 8 -i (Join-Path $dir "studio.mp4") -frames:v 1 (Join-Path $env:RUNNER_TEMP "studio/speed-8s.png")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-recordings
          path: ${{ runner.temp }}/*.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-selftest
          path: ${{ runner.temp }}/studio
