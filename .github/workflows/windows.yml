      - name: Studio export with a style (9:16, red background, trim, wood click sound, strong blur)
        run: |
          foreach ($k in "AUTOTEST", "AUTOSTUDIO", "AUTOINPUT", "AUTOAUDIO", "AUTOOUT", "STUDIO_COMPOSE", "STUDIO_ENCODER") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $proj = Join-Path $env:RUNNER_TEMP "studio/project"
          function Variant($name, $look) {
            $dir = Join-Path $env:RUNNER_TEMP "studio/$name"; Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue; Copy-Item $proj $dir -Recurse
            Remove-Item "$dir\project.json" -ErrorAction SilentlyContinue
            Set-Content "$dir\project.json" ('{"look":' + $look + ',"trimStart":0.5,"trimEnd":5.0}') -Encoding utf8NoBOM
            $env:STUDIO = $dir; $env:STUDIO_OUT = (Join-Path $env:RUNNER_TEMP "studio/$name.mp4")
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
            Write-Host "[$name] exit=$($p.ExitCode)`n$res"
            if ($p.ExitCode -ne 0) { throw "$name render failed" }
            return $env:STUDIO_OUT
          }
          $styled = Variant "styled" '{"aspect":"9:16","background":"color","color":{"r":1,"g":0,"b":0},"clickSound":true,"clickStyle":"wood","blur":"strong"}'
          $plain = Variant "plain" '{"aspect":"9:16","background":"color","color":{"r":1,"g":0,"b":0},"clickSound":false,"blur":"off"}'
          Remove-Item env:STUDIO; Remove-Item env:STUDIO_OUT
          $info = ffprobe -v error -show_entries "stream=codec_type,width,height:format=duration" -of json $styled | ConvertFrom-Json
          $v = $info.streams | Where-Object codec_type -eq video; $dur = [double]$info.format.duration
          Write-Host "styled: $($v.width)x$($v.height) duration=$dur"
          if ([Math]::Abs($v.width / $v.height - 9 / 16) -gt 0.01) { throw "not 9:16" }
          if ([Math]::Abs($dur - 4.5) -gt 0.15) { throw "trim 0.5–5.0 should give 4.5 s, got $dur" }
          ffmpeg -v error -y -ss 0.3 -i $styled -frames:v 1 (Join-Path $env:RUNNER_TEMP "studio/styled-frame.png")
          Add-Type -AssemblyName System.Drawing
          $b = [System.Drawing.Bitmap]::new((Join-Path $env:RUNNER_TEMP "studio/styled-frame.png")); $c = $b.GetPixel(3, 3); $b.Dispose()
          Write-Host "corner pixel: $($c.R),$($c.G),$($c.B)"
          if ($c.R -lt 200 -or $c.G -gt 50 -or $c.B -gt 50) { throw "background not red" }
          # 点击音效：开了的比没开的响（这台机器录的系统声音几乎是静音）
          function MaxVol($f) { $o = ffmpeg -hide_banner -i $f -af volumedetect -vn -f null - 2>&1 | Select-String "max_volume"; return [double](($o.ToString() -replace '.*max_volume:\s*(-?[\d.]+) dB.*', '$1')) }
          $clicks = @((Get-Content (Join-Path $proj "track.json") -Raw | ConvertFrom-Json).clicks | Where-Object { $_[0] -ge 0.5 -and $_[0] -lt 5.0 }).Count
          $ms = MaxVol $styled; $mp = MaxVol $plain
          Write-Host "clicks in range: $clicks  max volume with click sound: $ms dB  without: $mp dB"
          if ($clicks -gt 0 -and $ms -lt $mp + 6) { throw "click sound not audible in export" }

      - name: Studio cuts / speed-up, volume, click sounds after cuts, export options (resolution, fps, GIF, cancel, clipboard)
        run: |
          foreach ($k in "AUTOTEST", "AUTOSTUDIO", "AUTOINPUT", "AUTOAUDIO", "AUTOOUT", "STUDIO_COMPOSE", "STUDIO_ENCODER", "STUDIO") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $proj = Join-Path $env:RUNNER_TEMP "studio/project"
          $root = Join-Path $env:RUNNER_TEMP "studio/w1"; New-Item -ItemType Directory -Force $root | Out-Null
          Add-Type -AssemblyName System.Drawing
          function Dur($f) { return [double](ffprobe -v error -show_entries format=duration -of csv=p=0 $f) }
          function Variant($name, $json, $vars) {
            $dir = Join-Path $root $name; Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue; Copy-Item $proj $dir -Recurse
            Remove-Item "$dir\project.json" -ErrorAction SilentlyContinue
            Set-Content "$dir\project.json" $json -Encoding utf8NoBOM
            foreach ($k in "STUDIO_RES", "STUDIO_FPS", "STUDIO_QUALITY", "STUDIO_FORMAT", "STUDIO_CANCEL", "STUDIO_CLIP") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
            foreach ($k in $vars.Keys) { Set-Item "env:$k" $vars[$k] }
            $ext = if ($vars.STUDIO_FORMAT -eq "gif") { "gif" } else { "mp4" }
            $env:STUDIO = $dir; $env:STUDIO_OUT = (Join-Path $root "$name.$ext")
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
            Write-Host "[$name] exit=$($p.ExitCode)`n$res"
            foreach ($k in "STUDIO_RES", "STUDIO_FPS", "STUDIO_QUALITY", "STUDIO_FORMAT", "STUDIO_CANCEL", "STUDIO_CLIP", "STUDIO", "STUDIO_OUT") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
            return @{ exit = $p.ExitCode; res = $res; out = (Join-Path $root "$name.$ext") }
          }
          $D = Dur (Join-Path $proj "raw.mp4")
          $c1 = 0.2 * $D; $c2 = 0.35 * $D; $s1 = 0.5 * $D; $s2 = 0.75 * $D
          $inv = [Globalization.CultureInfo]::InvariantCulture
          function N($v) { return $v.ToString("0.###", $inv) }
          $base = '"segments":[],"segmentsEdited":true,"trimStart":0,"trimEnd":' + (N $D) + ',"look":{"blur":"off","clickSound":false}'
          $cuts = '"cuts":[{"id":"C1","start":' + (N $c1) + ',"end":' + (N $c2) + ',"mode":"cut","rate":4},{"id":"C2","start":' + (N $s1) + ',"end":' + (N $s2) + ',"mode":"speed","rate":4}]'
          # 1) 剪掉 / 快放：时长、剪掉段的画面不出现、快放段对上
          $plain = Variant "plain" ('{' + $base + '}') @{ STUDIO_RES = "720"; STUDIO_FPS = "30" }
          $cut = Variant "cut" ('{' + $base + ',' + $cuts + ',"voiceovers":[{"id":"V","file":"voice/x.m4a","start":1,"trimIn":0,"trimOut":1,"fileLength":1,"volume":1}]}') @{ STUDIO_RES = "720"; STUDIO_FPS = "30" }
          if ($plain.exit -ne 0 -or $cut.exit -ne 0) { throw "cut / plain render failed" }
          $want = $D - ($c2 - $c1) - ($s2 - $s1) * 0.75
          $got = Dur $cut.out
          Write-Host "duration with cuts: $got (expected $want; plain $(Dur $plain.out))"
          if ([Math]::Abs($got - $want) -gt 0.1) { throw "duration with cuts is wrong" }
          function Gray($f, $t, $o) { ffmpeg -v error -y -ss (N $t) -i $f -frames:v 1 -vf "scale=320:-2,format=gray" $o }
          function Psnr($a, $b) { $l = (ffmpeg -hide_banner -i $a -i $b -lavfi psnr -f null - 2>&1 | Select-String "average:").ToString(); return [double](($l -replace '.*average:([\d.inf]+).*', '$1') -replace 'inf', '99') }
          $pairs = @( @(($c1 + 0.3), ($c2 + 0.3), "after the cut"), @(($c1 + ($s1 - $c2) + ($s2 - $s1) / 8), ($s1 + ($s2 - $s1) / 2), "middle of the 4x part") )
          foreach ($pr in $pairs) {
            Gray $cut.out $pr[0] (Join-Path $root "a.png"); Gray $plain.out $pr[1] (Join-Path $root "b.png"); Gray $plain.out $pr[0] (Join-Path $root "c.png")
            $good = Psnr (Join-Path $root "a.png") (Join-Path $root "b.png"); $bad = Psnr (Join-Path $root "a.png") (Join-Path $root "c.png")
            Write-Host "$($pr[2]): out $(N $pr[0])s vs source $(N $pr[1])s PSNR $good dB (unmapped $bad dB)"
            if ($good -lt 30 -or $good -lt $bad) { throw "frame mapping wrong ($($pr[2]))" }
          }
          # Windows 不认识的字段（讲解）没丢
          $pj = Get-Content (Join-Path $root "cut/project.json") -Raw
          # 2) 剪掉之后的点击声：录到的声音静音、只留点击声，峰值落在换算后的时间上，剪掉段里的点击没声音
          $clk = Variant "clicks" ('{' + ($base -replace '"clickSound":false', '"clickSound":true,"clickStyle":"wood"') + ',' + $cuts + ',"audio":{"system":1,"mic":1,"clicks":1,"muted":true}}') @{ STUDIO_RES = "720"; STUDIO_FPS = "30" }
          if ($clk.exit -ne 0) { throw "clicks render failed" }
          $raw = Join-Path $root "clicks.f32"
          ffmpeg -v error -y -i $clk.out -vn -ac 1 -ar 48000 -f f32le $raw
          $bytes = [IO.File]::ReadAllBytes($raw); $n = [int]($bytes.Length / 4)
          $peaks = New-Object System.Collections.Generic.List[double]
          for ($i = 0; $i -lt $n - 480; $i += 480) {
            $m = 0.0; for ($j = 0; $j -lt 480; $j += 8) { $v = [Math]::Abs([BitConverter]::ToSingle($bytes, ($i + $j) * 4)); if ($v -gt $m) { $m = $v } }
            if ($m -gt 0.05 -and ($peaks.Count -eq 0 -or $i / 48000.0 - $peaks[$peaks.Count - 1] -gt 0.15)) { $peaks.Add($i / 48000.0) }
          }
          $track = Get-Content (Join-Path $proj "track.json") -Raw | ConvertFrom-Json
          function Out($s) { $d = 0.0; foreach ($pc in @(@($c1, $c2, 0), @($s1, $s2, 4))) { if ($s -le $pc[0]) { break }; $e = [Math]::Min($s, $pc[1]); $L = $e - $pc[0]; $d += $L - $(if ($pc[2] -eq 0) { 0 } else { $L / $pc[2] }) }; return $s - $d }
          $exp = @($track.clicks | Where-Object { -not ($_[0] -ge $c1 -and $_[0] -lt $c2) } | ForEach-Object { Out $_[0] } | Where-Object { $_ -lt $got - 0.1 })
          $dropped = @($track.clicks | Where-Object { $_[0] -ge $c1 -and $_[0] -lt $c2 }).Count
          Write-Host "expected clicks: $(($exp | ForEach-Object { N $_ }) -join ', ')  (dropped in cut: $dropped)"
          Write-Host "audio peaks:     $(($peaks | ForEach-Object { N $_ }) -join ', ')"
          foreach ($e in $exp) { if (-not ($peaks | Where-Object { [Math]::Abs($_ - $e) -lt 0.05 })) { throw "no click sound at $(N $e)s" } }
          if ($peaks.Count -gt $exp.Count) { throw "extra click sounds (clicks inside the cut should be silent)" }
          # 3) 音量：0.6 振幅的正弦，50% / 100% / 200%（软限幅，不削波）
          $vdir = Join-Path $root "vol"; New-Item -ItemType Directory -Force $vdir | Out-Null
          ffmpeg -v error -y -f lavfi -i "color=c=gray:s=640x360:r=30:d=4" -f lavfi -i "aevalsrc=0.6*sin(2*PI*300*t)|0.6*sin(2*PI*300*t):s=48000:d=4" -map 0:v -map 1:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 320k (Join-Path $vdir "raw.mp4")
          function PeakLin($f) { $l = (ffmpeg -hide_banner -ss 1 -t 2 -i $f -af astats=measure_overall=Peak_level -vn -f null - 2>&1 | Select-String "Peak level dB" | Select-Object -Last 1).ToString() -replace '.*Peak level dB:\s*(-?[\d.]+).*', '$1'; return [Math]::Pow(10, [double]$l / 20) }
          $src = PeakLin (Join-Path $vdir "raw.mp4"); Write-Host "source peak $([Math]::Round($src, 3))"
          Set-Content (Join-Path $vdir "track.json") '{"width":640,"height":360,"pixelsPerPoint":1,"moves":[[0,320,180,0,0]],"clicks":[],"keys":[],"cursors":[{"file":"c.png","hotX":0,"hotY":0,"w":16,"h":16,"arrow":true}]}' -Encoding utf8NoBOM
          foreach ($v in "0.5", "1", "2") {
            Set-Content (Join-Path $vdir "project.json") ('{"segments":[],"segmentsEdited":true,"trimStart":0,"trimEnd":4,"audio":{"system":' + $v + ',"mic":1,"clicks":1,"muted":false}}') -Encoding utf8NoBOM
            $env:STUDIO = $vdir; $env:STUDIO_OUT = (Join-Path $root "vol-$v.mp4"); $env:STUDIO_RES = "720"
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            Remove-Item env:STUDIO; Remove-Item env:STUDIO_OUT; Remove-Item env:STUDIO_RES
            if ($p.ExitCode -ne 0) { throw "volume $v render failed: $(Get-Content "$env:TEMP\recorder_test.txt" -Raw)" }
            $lin = PeakLin (Join-Path $root "vol-$v.mp4")
            Write-Host "volume $v -> peak $([Math]::Round($lin, 3)) (source $([Math]::Round($src, 3)))"
            if ($v -ne "2" -and [Math]::Abs($lin - $src * [double]$v) -gt 0.05) { throw "volume $v wrong: $lin" }
            if ($v -eq "2" -and ($lin -gt 0.95 -or $lin -lt 0.8)) { throw "200% should be limited to about 0.9: $lin" }
          }
          # 4) 导出设置：720p / 30 帧；GIF；取消；剪贴板
          $o = Variant "res720" ('{' + $base + '}') @{ STUDIO_RES = "720"; STUDIO_FPS = "30"; STUDIO_QUALITY = "small"; STUDIO_CLIP = "1" }
          $info = ffprobe -v error -select_streams v -show_entries "stream=width,height,r_frame_rate" -of json $o.out | ConvertFrom-Json
          $s0 = $info.streams[0]; Write-Host "720p: $($s0.width)x$($s0.height) $($s0.r_frame_rate)"
          if ([Math]::Min($s0.width, $s0.height) -gt 720 -or $s0.r_frame_rate -ne "30/1" -or ($s0.width % 2) -ne 0) { throw "720p / 30 fps not applied" }
          if ($o.res -notmatch "clipboard=OK") { throw "clipboard does not hold the exported file" }
          $g = Variant "gif" ('{' + $base + ',' + $cuts + '}') @{ STUDIO_FORMAT = "gif" }
          if ($g.exit -ne 0) { throw "gif failed" }
          $gi = ffprobe -v error -count_frames -show_entries "stream=width,height,nb_read_frames" -of json $g.out | ConvertFrom-Json
          $gs = $gi.streams[0]; $wantFrames = [Math]::Floor($want * 15)
          Write-Host "gif: $($gs.width)x$($gs.height) frames $($gs.nb_read_frames) (expected ~$wantFrames) size $((Get-Item $g.out).Length)"
          if ($gs.width -gt 960 -or [Math]::Abs([int]$gs.nb_read_frames - $wantFrames) -gt 3) { throw "gif size / frame count wrong" }
          $sp = Join-Path $root "long"; New-Item -ItemType Directory -Force $sp | Out-Null
          ffmpeg -v error -y -f lavfi -i "testsrc2=s=1920x1080:r=30:d=30" -f lavfi -i "sine=f=440:d=30" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac (Join-Path $sp "raw.mp4")
          $env:STUDIO = $sp; $env:STUDIO_OUT = (Join-Path $root "cancel.mp4"); $env:STUDIO_CANCEL = "3"; $env:STUDIO_RES = "original"; $env:STUDIO_FAKETRACK = "1"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          foreach ($k in "STUDIO", "STUDIO_OUT", "STUDIO_CANCEL", "STUDIO_RES", "STUDIO_FAKETRACK") { Remove-Item "env:$k" }
          $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
          Write-Host "cancel: exit=$($p.ExitCode) $res"
          if ($p.ExitCode -ne 0 -or -not $res.StartsWith("CANCELLED") -or (Test-Path (Join-Path $root "cancel.mp4"))) { throw "cancel did not stop / clean up" }
          Get-ChildItem $root -File | Format-Table Name, Length

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper-model
          key: whisper-ggml-base-60ed5bc3

      - name: W2 - voice-over rules / export timing / ducking / volume, captions rules / burn-in, noise reduction, whisper (model download + real recognition)
        run: |
          foreach ($k in "AUTOTEST", "AUTOSTUDIO", "AUTOINPUT", "AUTOAUDIO", "AUTOOUT", "STUDIO_COMPOSE", "STUDIO_ENCODER", "STUDIO") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $cache = Join-Path $env:RUNNER_TEMP "whisper-model"; $models = Join-Path $env:LOCALAPPDATA "录屏\models"
          New-Item -ItemType Directory -Force $models | Out-Null
          if (Test-Path "$cache\ggml-base.bin") { Copy-Item "$cache\ggml-base.bin" $models; Write-Host "model from cache" } else { Write-Host "no cached model: the app downloads it" }
          $work = Join-Path $env:RUNNER_TEMP "studio/w2"; New-Item -ItemType Directory -Force $work | Out-Null
          $env:W2TEST = $work; $env:W2SPEECH = (Resolve-Path windows/tests/zh-speech.wav).Path; $env:W2WHISPER = "1"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          Remove-Item env:W2TEST
          $txt = Get-Content "$env:TEMP\w2_test.txt" -Raw
          Write-Host "exit=$($p.ExitCode) wall=$([int]$sw.Elapsed.TotalSeconds)s"
          Write-Host $txt
          if (Test-Path "$models\ggml-base.bin") { New-Item -ItemType Directory -Force $cache | Out-Null; Copy-Item "$models\ggml-base.bin" $cache -Force }
          if ($p.ExitCode -ne 0 -or -not $txt.StartsWith("OK")) { throw "W2 tests failed" }

      - name: W2 - editor - record a voice-over (injected microphone), second take splits the first, Esc stops, captions from the voice-over, edit, export; screenshots
        run: |
          $proj = Join-Path $env:RUNNER_TEMP "studio/project"; $copy = Join-Path $env:RUNNER_TEMP "studio/voiceui"
          Remove-Item $copy -Recurse -Force -ErrorAction SilentlyContinue; Copy-Item $proj $copy -Recurse
          $shots = Join-Path $env:RUNNER_TEMP "studio/editor"; New-Item -ItemType Directory -Force $shots | Out-Null
          $env:VOICEUITEST = $copy; $env:VOICE_INJECT = (Resolve-Path windows/tests/zh-speech.wav).Path; $env:VOICE_NOCOUNTDOWN = "1"; $env:W2WHISPER = "1"; $env:VOICEUI_SHOTS = $shots; $env:APP_LANG = "zh"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          foreach ($k in "VOICEUITEST", "VOICE_INJECT", "VOICE_NOCOUNTDOWN", "W2WHISPER", "VOICEUI_SHOTS", "APP_LANG") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $txt = Get-Content "$env:TEMP\voiceui_test.txt" -Raw
          Write-Host "exit=$($p.ExitCode)`n$txt"
          Get-ChildItem "$env:TEMP\voiceui-export*.mp4" -ErrorAction SilentlyContinue | Copy-Item -Destination (Join-Path $env:RUNNER_TEMP "studio")
          if (Test-Path "$copy\project.json") { Copy-Item "$copy\project.json" (Join-Path $shots "project-after-voiceui.json") }
          if ($p.ExitCode -ne 0 -or -not $txt.StartsWith("OK")) { throw "voice-over / captions editor test failed" }
          # 英文界面也截一张（讲解轨 + 字幕轨 + 字幕样式）
          $env:EDITOR = $copy; $env:EDITORSHOT = (Join-Path $shots "voice-captions-en.png"); $env:APP_LANG = "en"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          foreach ($k in "EDITOR", "EDITORSHOT", "APP_LANG") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }

      - name: Main window - recent Studio footage list
        run: |
          $videos = [Environment]::GetFolderPath("MyVideos")
          $sf = Join-Path $videos "录屏\Studio 素材"; New-Item -ItemType Directory -Force $sf | Out-Null
          $proj = Join-Path $env:RUNNER_TEMP "studio/project"
          foreach ($n in "Recording A", "Recording B") { $d = Join-Path $sf $n; if (-not (Test-Path $d)) { Copy-Item $proj $d -Recurse } }
          $out = Join-Path $env:RUNNER_TEMP "studio/editor"; New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($lang in "zh", "en") {
            $env:APP_LANG = $lang; $env:MAINSHOT = (Join-Path $out "main-recents-$lang.png")
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            $txt = Get-Content "$env:TEMP\mainshot.txt" -Raw
            Write-Host "[$lang] exit=$($p.ExitCode) $txt"
            if ($p.ExitCode -ne 0 -or -not $txt.StartsWith("OK")) { throw "recents list missing" }
          }
          Remove-Item env:MAINSHOT; Remove-Item env:APP_LANG

      - name: Countdown overlay + hide desktop icons
        run: |
          $out = Join-Path $env:RUNNER_TEMP "studio/editor"; New-Item -ItemType Directory -Force $out | Out-Null
          $env:COUNTDOWNSHOT = (Join-Path $out "countdown.png")
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          Remove-Item env:COUNTDOWNSHOT
          $txt = Get-Content "$env:TEMP\countdown_test.txt" -Raw
          Write-Host "countdown exit=$($p.ExitCode)`n$txt"
          if ($p.ExitCode -ne 0 -or -not $txt.StartsWith("OK")) { throw "countdown test failed" }
          $env:ICONSTEST = "1"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          Remove-Item env:ICONSTEST
          $txt = Get-Content "$env:TEMP\icons_test.txt" -Raw
          Write-Host "icons exit=$($p.ExitCode)`n$txt"
          if ($p.ExitCode -ne 0 -or -not ($txt.StartsWith("OK") -or $txt.StartsWith("SKIP"))) { throw "desktop icons test failed" }

      - name: Studio GPU vs CPU compositor give the same picture; encoder fallback
        run: |
          $proj = Join-Path $env:RUNNER_TEMP "studio/project"
          foreach ($k in "AUTOTEST", "AUTOSTUDIO", "AUTOINPUT", "AUTOAUDIO", "AUTOOUT") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          function Render($compose, $out) {
            $env:STUDIO = $proj; $env:STUDIO_OUT = $out; $env:STUDIO_COMPOSE = $compose; $env:STUDIO_ENCODER = "libx264"
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
            Write-Host "[$compose] exit=$($p.ExitCode)`n$res"
            if ($p.ExitCode -ne 0) { throw "$compose render failed" }
            return $res
          }
          $g = Render "gpu" (Join-Path $env:RUNNER_TEMP "studio/gpu.mp4")
          $c = Render "cpu" (Join-Path $env:RUNNER_TEMP "studio/cpu.mp4")
          if ($g -notmatch "compose=GPU") { throw "gpu run did not use the GPU compositor" }
          if ($c -notmatch "compose=CPU") { throw "cpu run did not use the CPU compositor" }
          foreach ($t in "0.3", "1.6", "2.6", "4.4") {
            ffmpeg -v error -y -ss $t -i (Join-Path $env:RUNNER_TEMP "studio/gpu.mp4") -frames:v 1 (Join-Path $env:RUNNER_TEMP "studio/gpu-$t.png")
            ffmpeg -v error -y -ss $t -i (Join-Path $env:RUNNER_TEMP "studio/cpu.mp4") -frames:v 1 (Join-Path $env:RUNNER_TEMP "studio/cpu-$t.png")
          }
          # 整段逐帧比：PSNR（同一个编码器，只差合成方式）
          $psnr = ffmpeg -hide_banner -i (Join-Path $env:RUNNER_TEMP "studio/gpu.mp4") -i (Join-Path $env:RUNNER_TEMP "studio/cpu.mp4") -lavfi "[0:v][1:v]psnr" -f null - 2>&1 | Select-String "PSNR"
          Write-Host $psnr
          $line = ($psnr | Select-Object -Last 1).ToString()
          $avg = [double](($line -replace '.*average:([\d.inf]+).*', '$1') -replace 'inf', '99')
          Write-Host "PSNR average = $avg dB"
          if ($avg -lt 38) { throw "GPU and CPU pictures differ too much ($avg dB)" }
          # 自动挑编码器：这台机器没有显卡编码器，应该挨个试过然后用 libx264；显卡合成在这里没有真显卡，自动模式应该回到 CPU
          Remove-Item env:STUDIO_ENCODER; Remove-Item env:STUDIO_COMPOSE
          $env:STUDIO_OUT = Join-Path $env:RUNNER_TEMP "studio/auto.mp4"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
          Write-Host "[auto] exit=$($p.ExitCode)`n$res"
          if ($p.ExitCode -ne 0) { throw "auto render failed" }
          foreach ($e in "h264_nvenc", "h264_qsv", "h264_amf", "h264_mf") { if ($res -notmatch "probe ${e}: ") { throw "$e was not probed" } }
          if ($res -notmatch "encoder=libx264") { throw "did not fall back to libx264" }
          if ($res -notmatch "compose=CPU") { throw "auto mode should fall back to CPU compositing without a real GPU" }
          if (-not (Test-Path (Join-Path $proj "render.log"))) { throw "render.log missing" }
          Get-Content (Join-Path $proj "render.log") | Write-Host

      - name: Studio render speed (synthetic 1920x1080, 20 s)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "speed"; New-Item -ItemType Directory -Force $dir | Out-Null
          ffmpeg -v error -y -f lavfi -i "testsrc2=s=1920x1080:r=30:d=20" -f lavfi -i "sine=f=440:d=20" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac (Join-Path $dir "raw.mp4")
          foreach ($k in "AUTOTEST", "AUTOSTUDIO") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $env:STUDIO = $dir; $env:STUDIO_OUT = (Join-Path $dir "studio.mp4"); $env:STUDIO_FAKETRACK = "1"
          Write-Host "cpu: $((Get-CimInstance Win32_Processor).Name) x $([Environment]::ProcessorCount)"
          # 两种合成各跑一遍：CPU（这台机器没有真显卡时的实际情况）、显卡路径用软件渲染 WARP（只看正确性，速度不代表真显卡）
          foreach ($mode in "cpu", "gpu") {
            $env:STUDIO_COMPOSE = $mode
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
            Write-Host "[$mode] exit=$($p.ExitCode)`n$res"
            if ($p.ExitCode -ne 0) { throw "$mode render failed" }
          }
          Remove-Item env:STUDIO_COMPOSE
          ffmpeg -v error -y -ss 8 -i (Join-Path $dir "studio.mp4") -frames:v 1 (Join-Path $env:RUNNER_TEMP "studio/speed-8s.png")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-recordings
          path: ${{ runner.temp }}/*.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-selftest
          path: ${{ runner.temp }}/studio

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-selftest
          path: ${{ runner.temp }}/shots
