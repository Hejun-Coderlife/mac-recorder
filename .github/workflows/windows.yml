      - name: Studio editor - screenshots (English / Chinese, two widths, selected zoom, zoomed timeline, styles)
        run: |
          $out = Join-Path $env:RUNNER_TEMP "studio/editor"; New-Item -ItemType Directory -Force $out | Out-Null
          $proj = Join-Path $env:RUNNER_TEMP "studio/project"
          function Shot($name, $vars) {
            foreach ($k in "APP_LANG", "EDITOR_WIDTH", "EDITOR_SELECT", "EDITOR_TLZOOM", "EDITOR_LOOK", "EDITOR_DEMOCUTS") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
