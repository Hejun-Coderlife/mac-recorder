            $env:EDITOR = $proj; $env:EDITORSHOT = (Join-Path $out "$name.png")
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            Write-Host "[$name] exit=$($p.ExitCode) $(Get-Content "$env:TEMP\editorshot.txt" -Raw)"
            if ($p.ExitCode -ne 0) { throw "editor screenshot $name failed" }
          }
          Shot "en-1440" @{ APP_LANG = "en"; EDITOR_WIDTH = "1440" }
          Shot "zh-1440-selected" @{ APP_LANG = "zh"; EDITOR_WIDTH = "1440"; EDITOR_SELECT = "1" }
          Shot "zh-1920-tlzoom" @{ APP_LANG = "zh"; EDITOR_WIDTH = "1920"; EDITOR_TLZOOM = "3" }
          Shot "en-1440-gradient-9x16" @{ APP_LANG = "en"; EDITOR_WIDTH = "1440"; EDITOR_LOOK = '{"aspect":"9:16","background":"gradient","gradient0":{"r":1,"g":0.76,"b":0.62},"gradient1":{"r":0.97,"g":0.46,"b":0.62},"gradientAngle":160,"cursorScale":1.8,"clickSound":true,"hideIdleCursor":true}' }
          Shot "zh-1440-wallpaper" @{ APP_LANG = "zh"; EDITOR_WIDTH = "1440"; EDITOR_LOOK = '{"background":"wallpaper"}' }
          Shot "zh-1440-cuts-sound" @{ APP_LANG = "zh"; EDITOR_WIDTH = "1440"; EDITOR_DEMOCUTS = "1" }
          Shot "en-1920-cuts-sound" @{ APP_LANG = "en"; EDITOR_WIDTH = "1920"; EDITOR_DEMOCUTS = "1" }
          foreach ($k in "APP_LANG", "EDITOR_WIDTH", "EDITOR_SELECT", "EDITOR_TLZOOM", "EDITOR_LOOK", "EDITOR_DEMOCUTS", "EDITOR", "EDITORSHOT") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          Get-ChildItem $out | Format-Table Name, Length

