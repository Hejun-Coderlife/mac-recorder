# Windows 版：编译 → 把录制引擎、VC++ 运行库、ffmpeg 压缩嵌进去，出单个 录屏.exe（Release 资源名 ScreenRecorder.exe，另给 v1.2 自动更新用的 zip）→ 在 runner 上真录几秒自测（含首次启动、自动更新、Studio、截图、缩略图）
name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build (first pass, to get ScreenRecorderLib.dll)
        run: dotnet build windows/ScreenRecorder.csproj -c Release -p:Platform=x64

      - name: Embed runtime and build the single exe
        run: |
          $out = "windows/bin/x64/Release/net48"
          # Studio 效果读写视频用的 ffmpeg（BtbN 的 Windows 64 位 GPL 版，带 libx264），取最新的正式分支版
          $rel = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $asset = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n[\d.]+-latest-win64-gpl-[\d.]+\.zip$' } | Sort-Object { [version]($_.name -replace '^ffmpeg-n([\d.]+)-.*$', '$1') } | Select-Object -Last 1
          Write-Host "ffmpeg: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $ffdir = (Get-ChildItem ff -Directory | Select-Object -First 1).FullName
          # 录制引擎 + VC++ 运行库（ScreenRecorderLib 是 C++/CLI）+ ffmpeg 和它的许可证，各压成 .gz（7-Zip 最高压缩）嵌进 exe
          $files = @{
            "ScreenRecorderLib.dll" = "$out/ScreenRecorderLib.dll"
            "msvcp140.dll" = "C:\Windows\System32\msvcp140.dll"
            "vcruntime140.dll" = "C:\Windows\System32\vcruntime140.dll"
            "vcruntime140_1.dll" = "C:\Windows\System32\vcruntime140_1.dll"
            "concrt140.dll" = "C:\Windows\System32\concrt140.dll"
            "ffmpeg.exe" = "$ffdir/bin/ffmpeg.exe"
            "ffmpeg-LICENSE.txt" = "$ffdir/LICENSE.txt"
          }
          # Studio 显卡合成（Vortice D3D11）和它依赖的托管 dll，也嵌进去
          foreach ($d in Get-ChildItem "$out/*.dll") { if ($d.Name -ne "ScreenRecorderLib.dll") { $files[$d.Name] = $d.FullName } }
          New-Item -ItemType Directory -Force windows/embed | Out-Null
          New-Item -ItemType Directory -Force stage | Out-Null
          foreach ($k in $files.Keys) {
            Copy-Item $files[$k] "stage/$k"
            & "C:\Program Files\7-Zip\7z.exe" a -tgzip -mx=9 "windows/embed/$k.gz" "stage/$k" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "gzip $k failed" }
          }
          Get-ChildItem stage, windows/embed | Format-Table Name, Length
          dotnet build windows/ScreenRecorder.csproj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "second build failed" }
          # 发布物：单个 exe（GitHub 资源名不能用中文，叫 ScreenRecorder.exe）；v1.2 的自动更新只认 zip，zip 里也只放一个 录屏.exe
          New-Item -ItemType Directory -Force pkg, dist | Out-Null
          Copy-Item "$out/ScreenRecorder.exe" "pkg/录屏.exe"
          Copy-Item "$out/ScreenRecorder.exe" "dist/ScreenRecorder.exe"
          Compress-Archive -Path "pkg/录屏.exe" -DestinationPath dist/ScreenRecorder-Windows-x64.zip
          Get-ChildItem pkg, dist | Format-Table Name, Length

      - name: Check it's a single exe
        run: |
          $top = (Get-ChildItem pkg | ForEach-Object Name) -join '|'
          if ($top -ne '录屏.exe') { throw "pkg should only contain 录屏.exe: $top" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/ScreenRecorder-Windows-x64.zip))
          $names = ($z.Entries | ForEach-Object FullName) -join '|'; $z.Dispose()
          Write-Host "zip: $names"
          if ($names -ne '录屏.exe') { throw "zip should only contain 录屏.exe: $names" }
          $mb = (Get-Item pkg/录屏.exe).Length / 1MB
          Write-Host ("exe size: {0:N1} MB" -f $mb)
          if ($mb -lt 20) { throw "exe too small, runtime not embedded?" }

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-Windows-x64
          path: dist/*

      - name: Put ffmpeg / ffprobe on PATH
        run: |
          $ffdir = Get-ChildItem ff -Directory | Select-Object -First 1
          "$($ffdir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Self-test (first launch from an empty folder, runtime unpacked to LocalAppData)
        run: |
          Remove-Item "$env:LOCALAPPDATA\录屏" -Recurse -Force -ErrorAction SilentlyContinue
          $solo = Join-Path $env:RUNNER_TEMP "solo"; New-Item -ItemType Directory -Force $solo | Out-Null
          Copy-Item pkg/录屏.exe $solo
          foreach ($run in "first", "second") {
            $env:AUTOTEST = "2"; $env:AUTOOUT = Join-Path $env:RUNNER_TEMP "solo-$run.mp4"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath "$solo\录屏.exe" -Wait -PassThru
            Write-Host ("[$run launch] exit=$($p.ExitCode) wall={0:N1}s  $(Get-Content "$env:TEMP\recorder_test.txt" -Raw)" -f $sw.Elapsed.TotalSeconds)
            if ($p.ExitCode -ne 0) { throw "$run launch failed" }
          }
          $rt = Get-ChildItem "$env:LOCALAPPDATA\录屏\runtime" -Directory
          Write-Host "runtime dirs: $($rt.Name -join ', ')"
          if ($rt.Count -ne 1) { throw "expected exactly one runtime dir" }
          Get-ChildItem $rt[0].FullName -Force | Format-Table Name, Length
          foreach ($f in ".complete", "ScreenRecorderLib.dll", "vcruntime140.dll", "ffmpeg.exe", "ffmpeg-LICENSE.txt") { if (!(Test-Path (Join-Path $rt[0].FullName $f))) { throw "runtime missing $f" } }
          $top = (Get-ChildItem $solo -Force | ForEach-Object Name) -join '|'
          if ($top -ne '录屏.exe') { throw "app folder should stay clean: $top" }

      - name: Self-test (v1.2 user auto-updates to this build, old files cleaned up)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2 --repo "${{ github.repository }}" --pattern ScreenRecorder-Windows-x64.zip --dir v12
          $dir = Join-Path $env:RUNNER_TEMP "from12"
          Expand-Archive v12\ScreenRecorder-Windows-x64.zip $dir
          Write-Host "v1.2 layout: $((Get-ChildItem $dir | ForEach-Object Name) -join ', ')"
          # 用 v1.2 自己的更新器装这次的 zip（v1.2 支持 UPDATE_ZIP=本地包）
          $env:UPDATE_TEST = "1"; $env:UPDATE_FAKE_VERSION = "1.0"; $env:UPDATE_NORELAUNCH = "1"; $env:UPDATE_ZIP = (Resolve-Path dist/ScreenRecorder-Windows-x64.zip).Path
          $p = Start-Process -FilePath "$dir\录屏.exe" -Wait -PassThru
          $res = "$env:TEMP\update_test.txt"
          for ($i = 0; $i -lt 120 -and -not ((Test-Path $res) -and ((Get-Content $res -Raw) -match "COPIED|FAIL")); $i++) { Start-Sleep 1 }
          $txt = Get-Content $res -Raw
          Write-Host "exit=$($p.ExitCode)`n$txt"
          if ($txt -notmatch "COPIED OK") { throw "v1.2 updater failed" }
          if ((Get-FileHash "$dir\录屏.exe").Hash -ne (Get-FileHash pkg\录屏.exe).Hash) { throw "录屏.exe not replaced" }
          foreach ($k in "UPDATE_TEST", "UPDATE_ZIP", "UPDATE_FAKE_VERSION", "UPDATE_NORELAUNCH") { Remove-Item "env:$k" }
          # 新版第一次打开：把 v1.2 留下的「运行库」、README.txt 清掉，并且能录
          $env:AUTOTEST = "3"; $env:AUTOOUT = Join-Path $env:RUNNER_TEMP "after-update.mp4"
          $p = Start-Process -FilePath "$dir\录屏.exe" -Wait -PassThru
          Write-Host (Get-Content "$env:TEMP\recorder_test.txt" -Raw)
          if ($p.ExitCode -ne 0) { throw "app doesn't record after update" }
          $top = (Get-ChildItem $dir -Force | ForEach-Object Name) -join '|'
          Write-Host "after update: $top"
          if ($top -ne '录屏.exe') { throw "old v1.2 files not cleaned up: $top" }

      - name: Self-test (new updater replaces itself; online check falls back to the v1.2 zip; .old removed on next launch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "self"; New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item pkg/录屏.exe $dir
          $before = (Get-FileHash "$dir\录屏.exe").Hash
          # 线上最新版发的是什么就该换成什么：有单个 exe 就是它，没有（v1.2）就是 zip 里的 录屏.exe
          gh release download --repo "${{ github.repository }}" --pattern ScreenRecorder.exe --dir latest 2>$null
          if (Test-Path latest\ScreenRecorder.exe) { $expected = (Get-FileHash latest\ScreenRecorder.exe).Hash }
          else { Expand-Archive v12\ScreenRecorder-Windows-x64.zip v12x; $expected = (Get-FileHash "v12x\录屏.exe").Hash }
          $env:UPDATE_TEST = "1"; $env:UPDATE_FAKE_VERSION = "1.0"; $env:UPDATE_NORELAUNCH = "1"; $env:UPDATE_TOKEN = "${{ github.token }}"
          $p = Start-Process -FilePath "$dir\录屏.exe" -Wait -PassThru
          $txt = Get-Content "$env:TEMP\update_test.txt" -Raw
          Write-Host "exit=$($p.ExitCode)`n$txt"
          if ($p.ExitCode -ne 0 -or $txt -notmatch "REPLACED OK") { throw "self-replace failed" }
          if ((Get-FileHash "$dir\录屏.exe").Hash -ne $expected) { throw "录屏.exe is not the release build" }
          if ((Get-FileHash "$dir\录屏.exe.old").Hash -ne $before) { throw "录屏.exe.old should be the previous exe" }
          # 后台那套：先放进 %LOCALAPPDATA%\录屏\update，换上后那里清空，并记下「已更新到」最新版本号
          $tag = (gh release view --repo "${{ github.repository }}" --json tagName -q .tagName).TrimStart('v')
          if ($txt -notmatch "staged=True") { throw "update was not staged first" }
          if ($txt -notmatch "stageLeft=False") { throw "staged copy not cleaned up" }
          if ($txt -notmatch "updatedTo=$([regex]::Escape($tag))") { throw "updatedTo should be $tag" }
          foreach ($k in "UPDATE_TEST", "UPDATE_FAKE_VERSION", "UPDATE_NORELAUNCH", "UPDATE_TOKEN") { Remove-Item "env:$k" }
          # 下次启动删 .old
          $dir2 = Join-Path $env:RUNNER_TEMP "old"; New-Item -ItemType Directory -Force $dir2 | Out-Null
          Copy-Item pkg/录屏.exe $dir2; Set-Content "$dir2\录屏.exe.old" "old"
          $env:AUTOTEST = "3"; $env:AUTOOUT = Join-Path $env:RUNNER_TEMP "old-cleanup.mp4"
          $p = Start-Process -FilePath "$dir2\录屏.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "recording failed" }
          if (Test-Path "$dir2\录屏.exe.old") { throw ".old not removed" }

      - name: Self-test (silent update - staged update applied at next launch after a forced quit; "updated" notice shown once)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "staged"; New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item pkg/录屏.exe $dir
          # 假装上次后台已经下好了新版（就是这次的构建），程序却被强制结束、没来得及换
          $stage = Join-Path $env:LOCALAPPDATA "录屏\update"; New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item pkg/录屏.exe "$stage\ScreenRecorder.exe"
          $env:UPDATE_FAKE_VERSION = "1.0"
          Start-Process -FilePath "$dir\录屏.exe"
          for ($i = 0; $i -lt 30 -and (Test-Path $stage); $i++) { Start-Sleep 1 }
          Start-Sleep 5
          $running = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$dir\录屏.exe" })
          Write-Host "stage left: $(Test-Path $stage), running from $dir : $($running.Count)"
          $running | Stop-Process -Force
          Remove-Item env:UPDATE_FAKE_VERSION
          if (Test-Path $stage) { throw "staged update not applied at launch" }
          if ($running.Count -lt 1) { throw "app did not reopen after applying the staged update" }
          # 「已更新到」只提示一次
          $settings = Join-Path $env:APPDATA "录屏\settings.txt"
          $lines = @(Get-Content $settings -ErrorAction SilentlyContinue | Where-Object { $_ -notlike "updatedTo=*" }) + "updatedTo=1.4"
          Set-Content $settings $lines
          $env:UPDATESTATE_TEST = "1"
          Start-Process -FilePath "$dir\录屏.exe" -Wait
          $first = Get-Content "$env:TEMP\update_state.txt" -Raw
          Start-Process -FilePath "$dir\录屏.exe" -Wait
          $second = Get-Content "$env:TEMP\update_state.txt" -Raw
          Remove-Item env:UPDATESTATE_TEST
          Write-Host "first: $first second: $second"
          if ($first -notmatch "updatedTo=1\.4") { throw "updated notice missing" }
          if ($second -notmatch "updatedTo=\s*$") { throw "updated notice should show only once" }

      - name: Self-test (screen / region / window, no audio)
        run: |
          function Rec($name, $vars) {
            $out = Join-Path $env:RUNNER_TEMP "$name.mp4"
            Remove-Item "$env:TEMP\recorder_test.txt" -ErrorAction SilentlyContinue
            $env:AUTOTEST = "3"; $env:AUTOOUT = $out
            foreach ($k in "AUTOREGION", "AUTOWINDOW", "AUTOAUDIO") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
            foreach ($k in $vars.Keys) { Set-Item "env:$k" $vars[$k] }
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
            Write-Host "[$name] exit=$($p.ExitCode) $res"
            if ($p.ExitCode -ne 0 -or -not $res.StartsWith("OK")) { throw "$name failed" }
            $info = ffprobe -v error -show_entries "stream=codec_type,codec_name,width,height:format=duration" -of json $out | ConvertFrom-Json
            $v = $info.streams | Where-Object codec_type -eq video
            $dur = [double]$info.format.duration
            Write-Host "[$name] $($v.codec_name) $($v.width)x$($v.height) duration=$dur audio=$(@($info.streams | Where-Object codec_type -eq audio).Count)"
            if ($v.codec_name -ne "h264") { throw "${name}: no h264 video" }
            if ($dur -lt 2 -or $dur -gt 5) { throw "${name}: duration $dur not ~3s" }
            # 画面确实在动：抽两帧比较
            ffmpeg -v error -y -ss 0.5 -i $out -frames:v 1 "$env:RUNNER_TEMP\$name-a.png"
            ffmpeg -v error -y -ss 2.0 -i $out -frames:v 1 "$env:RUNNER_TEMP\$name-b.png"
            $ha = (Get-FileHash "$env:RUNNER_TEMP\$name-a.png").Hash; $hb = (Get-FileHash "$env:RUNNER_TEMP\$name-b.png").Hash
            if ($ha -eq $hb) { throw "${name}: frames identical, picture not moving" }
            return $v
          }
          Rec "screen" @{} | Out-Null
          $v = Rec "region" @{ AUTOREGION = "20,20,640,360" }
          if ($v.width -ne 640 -or $v.height -ne 360) { throw "region size $($v.width)x$($v.height), expected 640x360" }
          Rec "window" @{ AUTOWINDOW = "autotest" } | Out-Null

      - name: Self-test (screenshot - clipboard, thumbnail timeout to Desktop, hover, close button, drag out, overlay drag, Esc)
        run: |
          $out = Join-Path $env:RUNNER_TEMP "shots"; New-Item -ItemType Directory -Force $out | Out-Null
          $env:SHOTTEST = "1"; $env:SHOT_VISIBLE = "1"; $env:THUMB_SECONDS = "1.5"; $env:SHOTOUT = $out
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          $txt = Get-Content "$env:TEMP\shot_test.txt" -Raw
          Write-Host "exit=$($p.ExitCode)`n$txt"
          if ($p.ExitCode -ne 0 -or -not $txt.StartsWith("OK")) { throw "screenshot self-test failed" }

      - name: Self-test (shortcuts - taken one detected + notification, change by pressing keys, saved, new one opens the overlay)
        run: |
          $out = Join-Path $env:RUNNER_TEMP "shots"; New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($k in "SHOTTEST", "AUTOTEST") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $env:HOTKEYTEST = "1"; $env:SHOTOUT = $out
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          Remove-Item env:HOTKEYTEST
          $txt = Get-Content "$env:TEMP\hotkey_test.txt" -Raw
          Write-Host "exit=$($p.ExitCode)`n$txt"
          Get-Content "$env:APPDATA\录屏\settings.txt" | Write-Host
          if ($p.ExitCode -ne 0 -or -not $txt.StartsWith("OK")) { throw "shortcut self-test failed" }

      - name: Self-test (recording saved to Desktop + video thumbnail)
        run: |
          $out = Join-Path $env:RUNNER_TEMP "shots"; New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($k in "AUTOOUT", "AUTOREGION", "AUTOWINDOW", "AUTOAUDIO") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $env:AUTOTEST = "3"; $env:AUTOTHUMB = "1"; $env:SHOT_VISIBLE = "1"; $env:THUMB_SECONDS = "2"; $env:SHOTOUT = $out
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          $txt = Get-Content "$env:TEMP\recorder_test.txt" -Raw
          Write-Host "exit=$($p.ExitCode)`n$txt"
          if ($p.ExitCode -ne 0 -or -not $txt.StartsWith("OK")) { throw "recording failed" }
          $file = ($txt -split "`r?`n")[0].Substring(3).Trim()
          $desk = [Environment]::GetFolderPath("DesktopDirectory")
          Write-Host "file=$file desktop=$desk"
          if (-not $file.StartsWith($desk) -or -not (Test-Path $file)) { throw "recording not on the Desktop" }
          Copy-Item $file (Join-Path $out "desktop-recording.mp4")

      - name: Self-test (system audio)
        continue-on-error: true
        run: |
          $out = Join-Path $env:RUNNER_TEMP "audio.mp4"
          $env:AUTOTEST = "3"; $env:AUTOOUT = $out; $env:AUTOAUDIO = "1"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          Write-Host (Get-Content "$env:TEMP\recorder_test.txt" -Raw)
          if ($p.ExitCode -ne 0) { throw "audio recording failed (runner may have no audio device)" }
          ffprobe -v error -show_entries "stream=codec_type,codec_name,channels,sample_rate:format=duration" -of compact $out
          if (-not (ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 $out)) { throw "no audio track" }

      - name: Self-test (Studio effects, simulated mouse / clicks / typing)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "studio"; New-Item -ItemType Directory -Force $dir | Out-Null
          $out = Join-Path $dir "studio.mp4"
          foreach ($k in "AUTOREGION", "AUTOWINDOW") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $env:AUTOTEST = "6"; $env:AUTOOUT = $out; $env:AUTOSTUDIO = "1"; $env:AUTOINPUT = "1"; $env:AUTOAUDIO = "1"
          # 显卡合成：这台机器没有真显卡，强制用软件渲染（WARP）走一遍显卡那条路
          $env:STUDIO_COMPOSE = "gpu"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          Remove-Item env:STUDIO_COMPOSE
          $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
          Write-Host "exit=$($p.ExitCode)`n$res"
          if ($p.ExitCode -ne 0 -or -not $res.StartsWith("OK")) { throw "studio recording failed" }
          # 素材也留一份看
          $raw = ($res -split "`n" | Where-Object { $_ -match "^studio raw=(.+?) first" } | ForEach-Object { $Matches[1] })
          Copy-Item (Split-Path $raw) (Join-Path $dir "project") -Recurse
          Get-Content (Join-Path $dir "project/track.json") -Raw | Write-Host
          $info = ffprobe -v error -show_entries "stream=codec_type,codec_name,width,height,r_frame_rate:format=duration" -of json $out | ConvertFrom-Json
          $v = $info.streams | Where-Object codec_type -eq video; $a = @($info.streams | Where-Object codec_type -eq audio)
          $dur = [double]$info.format.duration
          Write-Host "studio: $($v.codec_name) $($v.width)x$($v.height) $($v.r_frame_rate) duration=$dur audio=$($a.Count)"
          if ($v.codec_name -ne "h264" -or $v.r_frame_rate -ne "60/1") { throw "not h264 60fps" }
          if ($dur -lt 5 -or $dur -gt 7.5) { throw "duration $dur not ~6s" }
          if ($a.Count -ne 1) { throw "expected one audio track" }
          foreach ($t in "0.3", "1.6", "2.6", "4.4", "5.5") { ffmpeg -v error -y -ss $t -i $out -frames:v 1 (Join-Path $dir "frame-$t.png") }
          Add-Type -AssemblyName System.Drawing
          # 画面四周一圈（外沿 2%）有多少接近白色：没放大时应该几乎全白（白色背景），放大后背景出画、应该很少
          function WhiteBorder($file) {
            $b = [System.Drawing.Bitmap]::new($file); $w = $b.Width; $h = $b.Height; $m = [int]([Math]::Min($w, $h) * 0.02); $n = 0; $white = 0
            for ($x = 0; $x -lt $w; $x += 7) { foreach ($y in 1, ($h - 2)) { $c = $b.GetPixel($x, $y); $n++; if ($c.R -gt 240 -and $c.G -gt 240 -and $c.B -gt 240) { $white++ } } }
            for ($y = 0; $y -lt $h; $y += 7) { foreach ($x in 1, ($w - 2)) { $c = $b.GetPixel($x, $y); $n++; if ($c.R -gt 240 -and $c.G -gt 240 -and $c.B -gt 240) { $white++ } } }
            $center = $b.GetPixel([int]($w / 2), [int]($h / 2)); $b.Dispose()
            return @{ white = $white / $n; center = $center }
          }
          $f0 = WhiteBorder (Join-Path $dir "frame-0.3.png"); $f1 = WhiteBorder (Join-Path $dir "frame-2.6.png")
          Write-Host "border white: 0.3s=$($f0.white)  2.6s=$($f1.white)"
          if ($f0.white -lt 0.95) { throw "white background missing at 0.3s ($($f0.white))" }
          if ($f1.white -gt 0.5) { throw "not zoomed in at 2.6s ($($f1.white))" }
          if ($res -notmatch "compose=GPU") { throw "GPU compositor was not used" }
          # 推近时镜头跟着鼠标：重新按素材算一遍镜头，放大着的帧里鼠标应该一直在画面中间附近
          $env:STUDIO = (Join-Path $dir "project"); $env:STUDIO_OUT = (Join-Path $dir "follow.mp4"); $env:STUDIO_PLANDUMP = (Join-Path $dir "plan.csv")
          foreach ($k in "AUTOTEST", "AUTOSTUDIO", "AUTOINPUT", "AUTOAUDIO", "AUTOOUT") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          foreach ($k in "STUDIO", "STUDIO_OUT", "STUDIO_PLANDUMP") { Remove-Item "env:$k" }
          if ($p.ExitCode -ne 0) { throw "re-render for follow check failed" }
          # 镜头顶到画布边的那个方向不算（点在屏幕边上时本来就没法让鼠标居中）
          $zoomed = @(Get-Content (Join-Path $dir "plan.csv") | ForEach-Object { $c = $_ -split ','; if ([double]$c[1] -gt 1.8) {
              if ($c[4] -eq '0') { [Math]::Abs([double]$c[2]) }
              if ($c[5] -eq '0') { [Math]::Abs([double]$c[3]) } } })
          if ($zoomed.Count -lt 30) { throw "too few zoomed samples ($($zoomed.Count))" }
          $sorted = $zoomed | Sort-Object
          $median = $sorted[[int]($sorted.Count / 2)]; $p90 = $sorted[[int]($sorted.Count * 0.9)]
          Write-Host "zoomed samples (not at canvas edge): $($zoomed.Count)  cursor offset from center (1 = edge): median=$median p90=$p90"
          if ($median -gt 0.3 -or $p90 -gt 0.6) { throw "camera does not follow the cursor closely enough" }

      - name: Studio GPU vs CPU compositor give the same picture; encoder fallback
        run: |
          $proj = Join-Path $env:RUNNER_TEMP "studio/project"
          foreach ($k in "AUTOTEST", "AUTOSTUDIO", "AUTOINPUT", "AUTOAUDIO", "AUTOOUT") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          function Render($compose, $out) {
            $env:STUDIO = $proj; $env:STUDIO_OUT = $out; $env:STUDIO_COMPOSE = $compose; $env:STUDIO_ENCODER = "libx264"
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
            Write-Host "[$compose] exit=$($p.ExitCode)`n$res"
            if ($p.ExitCode -ne 0) { throw "$compose render failed" }
            return $res
          }
          $g = Render "gpu" (Join-Path $env:RUNNER_TEMP "studio/gpu.mp4")
          $c = Render "cpu" (Join-Path $env:RUNNER_TEMP "studio/cpu.mp4")
          if ($g -notmatch "compose=GPU") { throw "gpu run did not use the GPU compositor" }
          if ($c -notmatch "compose=CPU") { throw "cpu run did not use the CPU compositor" }
          foreach ($t in "0.3", "1.6", "2.6", "4.4") {
            ffmpeg -v error -y -ss $t -i (Join-Path $env:RUNNER_TEMP "studio/gpu.mp4") -frames:v 1 (Join-Path $env:RUNNER_TEMP "studio/gpu-$t.png")
            ffmpeg -v error -y -ss $t -i (Join-Path $env:RUNNER_TEMP "studio/cpu.mp4") -frames:v 1 (Join-Path $env:RUNNER_TEMP "studio/cpu-$t.png")
          }
          # 整段逐帧比：PSNR（同一个编码器，只差合成方式）
          $psnr = ffmpeg -hide_banner -i (Join-Path $env:RUNNER_TEMP "studio/gpu.mp4") -i (Join-Path $env:RUNNER_TEMP "studio/cpu.mp4") -lavfi "[0:v][1:v]psnr" -f null - 2>&1 | Select-String "PSNR"
          Write-Host $psnr
          $line = ($psnr | Select-Object -Last 1).ToString()
          $avg = [double](($line -replace '.*average:([\d.inf]+).*', '$1') -replace 'inf', '99')
          Write-Host "PSNR average = $avg dB"
          if ($avg -lt 38) { throw "GPU and CPU pictures differ too much ($avg dB)" }
          # 自动挑编码器：这台机器没有显卡编码器，应该挨个试过然后用 libx264；显卡合成在这里没有真显卡，自动模式应该回到 CPU
          Remove-Item env:STUDIO_ENCODER; Remove-Item env:STUDIO_COMPOSE
          $env:STUDIO_OUT = Join-Path $env:RUNNER_TEMP "studio/auto.mp4"
          $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
          $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
          Write-Host "[auto] exit=$($p.ExitCode)`n$res"
          if ($p.ExitCode -ne 0) { throw "auto render failed" }
          foreach ($e in "h264_nvenc", "h264_qsv", "h264_amf", "h264_mf") { if ($res -notmatch "probe ${e}: ") { throw "$e was not probed" } }
          if ($res -notmatch "encoder=libx264") { throw "did not fall back to libx264" }
          if ($res -notmatch "compose=CPU") { throw "auto mode should fall back to CPU compositing without a real GPU" }
          if (-not (Test-Path (Join-Path $proj "render.log"))) { throw "render.log missing" }
          Get-Content (Join-Path $proj "render.log") | Write-Host

      - name: Studio render speed (synthetic 1920x1080, 20 s)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "speed"; New-Item -ItemType Directory -Force $dir | Out-Null
          ffmpeg -v error -y -f lavfi -i "testsrc2=s=1920x1080:r=30:d=20" -f lavfi -i "sine=f=440:d=20" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac (Join-Path $dir "raw.mp4")
          foreach ($k in "AUTOTEST", "AUTOSTUDIO") { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
          $env:STUDIO = $dir; $env:STUDIO_OUT = (Join-Path $dir "studio.mp4"); $env:STUDIO_FAKETRACK = "1"
          Write-Host "cpu: $((Get-CimInstance Win32_Processor).Name) x $([Environment]::ProcessorCount)"
          # 两种合成各跑一遍：CPU（这台机器没有真显卡时的实际情况）、显卡路径用软件渲染 WARP（只看正确性，速度不代表真显卡）
          foreach ($mode in "cpu", "gpu") {
            $env:STUDIO_COMPOSE = $mode
            $p = Start-Process -FilePath "pkg\录屏.exe" -Wait -PassThru
            $res = Get-Content "$env:TEMP\recorder_test.txt" -Raw
            Write-Host "[$mode] exit=$($p.ExitCode)`n$res"
            if ($p.ExitCode -ne 0) { throw "$mode render failed" }
          }
          Remove-Item env:STUDIO_COMPOSE
          ffmpeg -v error -y -ss 8 -i (Join-Path $dir "studio.mp4") -frames:v 1 (Join-Path $env:RUNNER_TEMP "studio/speed-8s.png")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-recordings
          path: ${{ runner.temp }}/*.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-selftest
          path: ${{ runner.temp }}/studio

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-selftest
          path: ${{ runner.temp }}/shots
