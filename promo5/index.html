    // 摄像头布局：小窗 → 分屏 → 全屏（人像是示意）
    const fi = Math.floor(st * 30) + 300; Ai.style.objectFit = 'cover'; setImg(Ai, frameOf('tut', 't', fi, 870)); need(Ai);
    const l1 = s.lines[1]?.start ?? 99, kA = ease((t - l1 - .3) / .5), kB = ease((t - l1 - 2.0) / .5);
    const fullR = [160, 90, 1600, 900], split = [160, 90, 1080, 900];
    place(A, lerp(fullR[0], split[0], kA), 90, lerp(fullR[2], split[2], kA), 900, 22);
    A.style.opacity = 1 - kB;
    const bub = [1520, 760, 200, 200, 100], sp = [1270, 90, 490, 900, 22], fu = [160, 90, 1600, 900, 22];
    const r = kB > 0 ? sp.map((v, j) => lerp(v, fu[j], kB)) : bub.map((v, j) => lerp(v, sp[j], kA));
    Object.assign(cp.style, { left: r[0] + 'px', top: r[1] + 'px', width: r[2] + 'px', height: r[3] + 'px', borderRadius: (kA < .5 ? '50%' : r[4] + 'px'), opacity: clamp(st / .4) });
  }
}

// ———— Windows 段落（示意）————
function drawWin(s, L, rt, t, op) {
  const el = $('L_win'); show(el, true); el.style.opacity = op;
  const i = L ? L.idx : 0, sel = $('wSel'), th = $('wThumb'), ci = $('chatImg');
  show(sel, false); th.style.opacity = 0; ci.style.opacity = 0; $('wFlash').style.opacity = 0;
  if (i === 1) {
    $('keys').innerHTML = '<span class="kc">Ctrl</span><span class="kc">Alt</span><span class="kc">X</span>'; $('keys').style.opacity = clamp(rt / .3) * clamp((1.6 - rt) / .3);
    if (rt > 1.6) { show(sel, true); const k = ease((rt - 1.7) / 1.2), w = lerp(40, 640, k), h = lerp(30, 316, k);
      Object.assign(sel.style, { left: '260px', top: '220px', width: w + 'px', height: h + 'px' }); cursorAt(260 + w, 220 + h, k < 1);
      if (rt > 3.0) $('wFlash').style.opacity = clamp(1 - (rt - 3.0) / .3) * .7; }
  }
  if (i >= 2) {
    const k = easeOut((t - s.lines[2].start) / .5); let x = lerp(1900, 1580, k), y = 860;
    if (i === 3) { const k2 = ease((rt - .4) / 1.3); x = lerp(1580, 1440, k2); y = lerp(860, 300, k2); cursorAt(x + 150, y + 74, k2 > 0 && k2 < 1);
      th.style.opacity = rt > 1.7 ? clamp(1 - (rt - 1.7) / .2) : 1; ci.style.opacity = clamp((rt - 1.7) / .25); }
    else { th.style.opacity = 1; cursorAt(900, 600); }
    th.style.left = x + 'px'; th.style.top = y + 'px';
    if (i === 2) th.style.opacity = k;
  }
}
